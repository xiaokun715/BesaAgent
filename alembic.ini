# Alembic configuration.
#
# NOTE: THIS FILE MUST STAY ASCII-ONLY.
#
# Alembic reads this file with `encoding="locale"`, which is cp936 (GBK) on a
# Chinese Windows install. A UTF-8 Chinese comment here makes alembic die with
# `UnicodeDecodeError: 'gbk' codec can't decode byte ...` before it even starts.
# Setting PYTHONUTF8=1 works around it, but depending on an env var for a build
# tool to run at all is fragile -- so the rationale lives in migrations/env.py
# (a .py file, which Python always reads as UTF-8), and this file stays ASCII.
#
# There is deliberately NO dsn here either. The single source of truth for
# configuration is configs/*.yaml plus .env; migrations/env.py loads it via
# foundation.settings.load_config(). Writing a second DSN here would create two
# answers, and the symptom of them disagreeing is "migrations ran against
# database A while the app connected to B", reported as "table does not exist".

[alembic]
script_location = migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
