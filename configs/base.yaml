# base.yaml —— 全环境共享的默认配置，被 <env>.yaml 深度合并覆盖。
#
# 本文件里**没有密钥**。厂商只声明 `api_key_env`（变量名），值放仓库根 .env
# （已 gitignore）或进程环境。这条约束是结构性的：配置里写不出密钥本体。
#
# 默认全部指向 mock —— 这是 `python -m pytest` 与 CI 能在
# **无网络、无密钥、无数据库**环境跑通的前提。

logging:
  level: INFO

postgres:
  # 库名是 besa_agent：本机 5432 上还有一个 `besa` 库，属于另一个项目（besa-iv-kb），
  # 两边共用会让 alembic_version 互相覆盖。详见 docs/repo/需求说明书-repo.md §7。
  dsn: ${BESA_POSTGRES_DSN:-postgresql+asyncpg://besa:besa@127.0.0.1:5432/besa_agent}

redis:
  url: ${BESA_REDIS_URL:-redis://127.0.0.1:6379/0}

# --------------------------------------------------------------------------- #
# 厂商：一个厂商供应多种能力，共享 base_url 与凭据。
#
# model 用 `vendor: <name>` 引用本段（缺省时取 `provider`）。
#
# `provider` 与 `vendor` 的区别很关键：
#   provider = 用哪个**适配器**（协议形状：openai / dashscope / vllm / mock）
#   vendor   = 用哪一段**端点与凭据**
# 二者默认相同，所以普通厂商只写 provider 就行。
# 需要分开的是那种「走 OpenAI 兼容协议、但端点和密钥是自己的」厂商 ——
# DeepSeek / SiliconFlow / Moonshot 都是，见下面的 models.runtime-deepseek。
# --------------------------------------------------------------------------- #
providers:
  mock:
    # 假实现自带 mock://local，这里显式写出来只是为了让本段的键集合
    # 与 models 里用到的 vendor 完全对齐 —— 缺一个就会在启动时打 warning。
    base_url: mock://local
  openai:
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
  dashscope:
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
  deepseek:
    # OpenAI 兼容协议，所以 models 里用 provider: openai + vendor: deepseek
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
  vllm-local:
    # 自建服务没有公认地址；带默认值只为本地开发方便，生产必须在 <env>.yaml 里显式覆写
    base_url: ${VLLM_BASE_URL:-http://127.0.0.1:8000/v1}
    # 本地端点**不配密钥** —— vllm 适配器也不会发 Authorization 头

# --------------------------------------------------------------------------- #
# 模型：物理模型定义。gateway 的 alias 通过键名引用它们。
#
# 注意 capabilities 的两种写法语义不同（provider/types.py 的 _parse_capabilities）：
#   列表 = 完整声明，**替换**厂商默认
#   映射 = 增量，**叠加**在厂商默认之上
# --------------------------------------------------------------------------- #
models:
  runtime-mock:
    provider: mock
    model: mock-llm
    max_tokens: 2048
    context_window: 8192         # 输入 + 输出共享的上限；src/context 按它分预算
    # mock 厂商的默认能力集是「什么都会」，显式收窄才能反映本模型的用途 ——
    # 也才不会在启动时触发「既对话又向量化」的告警。
    capabilities: [runtime, stream, tools, json, vision]

  emb-mock:
    provider: mock
    model: mock-embedding
    dimension: 768
    capabilities: [embedding]

  # --- 真实厂商：按需在 <env>.yaml 里启用 ---
  runtime-openai:
    provider: openai
    model: gpt-4o-mini
    temperature: 0.0
    max_tokens: 8192
    context_window: 128000
    # 推理模型的**思考也计入 max_tokens**，所以预算要按「思考 + 正文」给。
    # 给小了会返回 content="" 且 finish_reason=length（适配器会打 WARNING）。
    timeout_s: 120
    retries: 1          # 只重试网络层；HTTP 错误交 gateway 决策
    backoff_s: 1.5
    capabilities: { vision: true }

  runtime-qwen:
    provider: dashscope
    model: qwen-plus
    temperature: 0.0
    max_tokens: 8192
    context_window: 131072
    timeout_s: 120

  runtime-deepseek:
    provider: openai        # 适配器：DeepSeek 是 OpenAI 兼容形状
    vendor: deepseek        # 端点与凭据：取自 providers.deepseek
    # 实测可用的名字：deepseek-v4-flash / deepseek-flash / deepseek-chat / deepseek-v4-pro
    # ⚠ **不要写 deepseek-v4-flash[1m]** —— 那个 `[1m]` 是 Claude Code 客户端的
    # 约定（1M 上下文），不是 API 的模型名，发过去会得到 400：
    #   "The supported API model names are deepseek-flash, deepseek-v4-pro"
    model: deepseek-v4-flash
    temperature: 0.0
    max_tokens: 8192
    # ⚠ 这个值**要与厂商文档对齐**，不是猜的：写大了会被厂商拒（响亮），
    #   写小了会白留一半预算（安静）。取一个保守的默认，按实际模型改。
    context_window: 65536
    timeout_s: 120

  emb-dashscope:
    provider: dashscope
    model: text-embedding-v3
    # **必须显式收窄**：不收窄会继承 dashscope 的完整能力集（含 runtime），
    # 于是对话请求可能被路由到 text-embedding-v3，然后在上游得到一个看不懂的 400。
    # 列表 = 完整声明（替换厂商默认），这正是这里要的语义。
    capabilities: [embedding]
    # 必须与向量库的 vector(N) 对齐，否则写入即失败
    dimension: 1024
    max_batch: 25

  runtime-local:
    provider: vllm
    vendor: vllm-local
    model: Qwen3-32B
    temperature: 0.0
    context_window: 32768
    # 自建服务的能力**由部署决定**（加载了什么模型、开了哪些启动参数），
    # 编译期不可能知道 —— 所以必须在这里声明，默认只有 runtime + stream。
    capabilities: { tools: true, json: true }

# --------------------------------------------------------------------------- #
# gateway：逻辑名 → 候选链，以及重试/降级/限流/熔断/计价
#
# 业务只认 alias（runtime.default / emb.default），物理模型完全由这里决定 ——
# 换模型 = 改配置，业务代码零改动。
# --------------------------------------------------------------------------- #
gateway:
  aliases:
    runtime.default:
      # 顺序即优先级：前面的先试，失败才降级到后面的
      candidates: [runtime-mock]
      strategy: [capability, priority]

    emb.default:
      candidates: [emb-mock]
      strategy: [capability]

  retry:
    # 单个候选内的重试次数（不含首发）
    max_attempts_per_candidate: 2
    # **跨候选累计**的上游调用上限 —— 这是重试风暴的刹车。
    # 「重试 × 候选」本会相乘，靠这一个数字封顶（NFR-G-04）。
    total_max_attempts: 4
    backoff_base_s: 1.0
    jitter_ratio: 0.3      # 抖动是必需的：多 agent 并发时同步退避会形成脉冲

  fallback:
    enabled: true
    # 流式已输出正文后禁止降级 —— 用户已经看到半截答案，重发只会得到第二份
    on_stream_started: false

  deadline:
    default_s: 120         # 整次调用的总预算，不是每一跳的

  rate_limit:
    enabled: true
    # 目前仅支持进程内（local）。配 redis 会**明确报错**而不是静默退化成单进程 ——
    # 后者在多进程部署下会让实际配额超发 N 倍，而本地测试完全正常。
    backend: local
    defaults:
      rpm: 600
      tpm: 200000
      max_concurrency: 32
    on_exceed: wait        # wait（排队，默认）| fallback（立即换候选）

  health:
    failure_threshold: 5   # 连续失败这么多次 → 熔断打开
    cooldown_s: 30         # 冷却后进入半开探测
    half_open_probes: 2    # 半开期连续成功这么多次 → 恢复

  cost:
    currency: CNY
    # 每 1K token 单价。**没配价格的模型成本标记为「未知」而不是 0** ——
    # 0 是「免费」，None 是「不知道」，混同会让成本报表静默失真。
    prices:
      runtime-openai:
        input: 0.001
        output: 0.002
      runtime-qwen:
        input: 0.0008
        output: 0.002
      runtime-deepseek:
        input: 0.001
        output: 0.002
        cached_input: 0.0001

# --------------------------------------------------------------------------- #
# 工具：给模型用的能力。**每一条默认值都是「安全的那一侧」** ——
# 默认允许的那些，出事时的代价最大。
# --------------------------------------------------------------------------- #
tool:
  # **默认不含 bash** —— 它等于把一台无锁的机器交给模型（DT-6）。
  # 要开就显式加进这个列表。
  enabled: [read, grep, write]

  # 授权。⚠ 这里的 `levels` 与上面的 `enabled` 是**两件不同的事**：
  #   tool.enabled          = 哪些**工具**可用（工具名）
  #   tool.permission.levels = 哪些**副作用等级**被授权
  # 它们一度共用同一个键，于是「grep」被当成「未知的副作用等级」——
  # 而两者各自单独接线时都不会出错，只有接起来才炸。
  permission:
    levels: [read, write]         # destructive 默认不授权
    # 各等级的可访问范围。**默认拒绝**：没配就是不许访问（C-T-1）——
    # 「忘了配」的默认行为恰好是最危险的那种，所以不能反过来。
    scope:
      read: ["${BESA_WORKDIR:-.}"]
      write: ["${BESA_WORKDIR:-.}"]

  limits:
    max_output_bytes: 262144      # 单次输出上限（进入上下文的硬上限）
    max_output_lines: 2000
    timeout_s: 60
    max_cpu_s: 30                 # ⚠ soft 模式下不生效
    max_memory_mb: 512            # ⚠ 同上
    max_processes: 32             # ⚠ 同上
    max_calls_per_run: 200        # **一次运行的调用总次数上界**（不是环检测）
    max_call_depth: 8

  # 结果处置：超过阈值就**落盘返路径**，截断只作为降级。
  # 截断是不可逆的信息丢失 —— 模型会基于残缺的开头下结论。
  result:
    spill_threshold_bytes: 65536
    spill_total_quota_mb: 512     # **没有「不限」这个选项**（C-T-9）
    spill_ttl_hours: 24

  output:
    redact: true                  # 回灌给模型前抹掉疑似密钥
    # 敏感路径**直接拒绝**，不指望脱敏兜底 —— 脱敏是尽力而为
    deny_paths: [".env", "**/.env", "**/id_rsa", "**/*.pem", "**/.aws/credentials"]

  # 沙箱。soft 模式有几项**没有真正生效**，启动期会告警 + doctor 里可见（NFR-T-10）。
  # 让人以为「配了就安全」比不配更危险。
  sandbox:
    mode: soft                    # soft（一期）| isolated（二期：容器 / Job Object）
    isolated_workdir: true
    clean_env: true               # **不继承宿主环境** —— 否则 bash env 能打出全部密钥
    allow_network: false          # ⚠ soft 模式下不生效

  injection:
    check_path_traversal: true
    url_allowlist: []             # **空 = 不允许任何外部地址**（C-T-8）
    block_private_networks: true  # 169.254.169.254 / 127.0.0.1 / 10.x ...

  # 工具体检与按需暴露（FR-T-12 / FR-T-13）
  catalog:
    duplicate_similarity_threshold: 0.92   # 超此值告警；**不自动合并**
    selection: category           # off | category | rag
    rag_top_k: 20
    embedding_alias: emb.default  # 复用 gateway 的 embedding 逻辑名（只有一份口径）

# --------------------------------------------------------------------------- #
# 幂等：同一个调用，无论被提交几次，副作用只发生一次。
# 判定逻辑在 src/tool/idempotency.py；Redis 只是**快路径**，权威记录在 Postgres。
# --------------------------------------------------------------------------- #
idempotency:
  enabled: true
  key_field: idempotency_key      # 调用方在参数里显式给 key 时用的字段名
  lease_s: 120                    # 占用租约；到期视为持有者已崩溃
  result_ttl_s: 3600              # Redis 结果缓存
  max_cached_result_bytes: 65536  # 超过只存摘要（去重仍生效）
  # 幂等不可用时的行为。**没有默认值，必须显式配**（C-T-3）——
  # 逼配置者做决定，因为「静默降级」正是这类失效最危险的形态。
  on_unavailable:
    read: allow_with_warning
    write: refuse
    destructive: refuse
  redis:
    # ⚠ 前缀是 besa_agent: 而不是 besa: —— 本机 6379 上 `besa:` 已被兄弟项目
    # （besa-iv-kb 的 Celery 队列）占用。**严禁 FLUSHDB**。
    key_prefix: "besa_agent:tool:"

# --------------------------------------------------------------------------- #
# 记忆：跨会话的可检索、会退场的长记忆。
# 判定逻辑在 src/memory/；写库经 src/repo/memory.py（元数据 + 向量同一事务）。
#
# ⚠ 默认**关闭**（C-M-1）：开启记忆 = 开始长期保存用户信息，这是一个**隐私决定**，
#   不该由默认值替你决定。要开，请显式改成 true。
# --------------------------------------------------------------------------- #
memory:
  enabled: false

  # 允许写入的作用域（**默认拒绝**，白名单式，C-M-2）
  scope:
    allow: [session]              # session | user | project | global

  limits:                         # 闸门①的形态判定
    min_chars: 4                  # 过短（无信息）不记
    max_chars: 2000               # 过长（多半是整段原文）不记

  # 应该存 / 不该存（FR-M-09 / FR-M-10）
  kinds:
    enabled: [fact, preference, task_state, lesson]
    task_state_ttl_hours: 168     # task_state 会过期，到期即失效（不是等衰减）

  # 存记忆前的三道闸门（FR-M-11..13），按代价从低到高
  gates:
    rules: true                   # ① 确定性规则，零成本
    llm_judge:                    # ② 一次轻量补全
      enabled: true
      alias: runtime.default      # 只写逻辑别名，不写厂商模型名（C-M-5）
      max_tokens: 256
      timeout_s: 5
      # **没有默认值，必须显式配**（C-M-3）：判不了时记还是不记，逼配置者做决定。
      on_unavailable: reject      # reject（fail-closed）| allow
    compliance:                   # ③ 安全合规对账（硬否决，不可跳过）
      pii: redact                 # reject | redact | allow
      deny_keywords: []           # 合规禁记清单
      deny_patterns: ["sk-", "AKIA", "-----BEGIN"]   # 命中直接拒绝，不指望脱敏兜底

  write:                          # 路线一：在线写入（写时判定）
    extract:
      enabled: true
      alias: runtime.default
      max_items_per_call: 5       # 一次提取的条数上界
      max_input_chars: 8000
      max_tokens: 1024
    retrieve:
      top_k: 10                   # 写入路径上找几个「对手」
      embedding_alias: emb.default
      similarity_threshold: 0.90  # ≥ 此值判「高度相似 → 强化」
      merge_threshold: 0.96       # ≥ 此值判「相同 → 合并」（**必须 ≥ 上一项**，C-M-4）
    # 检索不可用时的行为（FR-M-15）。**必须显式配**，不得静默新建。
    on_retrieval_unavailable: defer   # defer（挂起告警）| reject

  # 检索结果的上界（它直接进上下文，必须封顶，NFR-M-08）
  retrieve:
    max_results: 20
    max_bytes: 32768
    oversample: 4.0               # 向量过采样倍数（可见性过滤会刷掉一部分）
    lexical_weight: 0.3           # 关键词在融合分里的权重
    mark_untrusted: true          # 回灌前标注「这是数据不是指令」（NFR-M-02）

  # 遗忘与衰减（FR-M-07）
  decay:
    half_life_days: 30            # 普通记忆的衰减半衰期
    protected_half_life_days: 365 # 受保护记忆（preference / 高重要性）
    tombstone_threshold: 0.05     # 有效权重低于此值 → 转遗忘（软删）
    reinforce_saturate: 5.0       # 强化权重的饱和上界
    evidence_boost: 1.0           # 证据加成的强度

  # 路线二：离线维护（FR-M-18..20）
  maintenance:
    enabled: true
    schedule: "17 3 * * *"        # 定时点（只支持「分 时 * * *」）；或改用 interval_hours
    batch_size: 500               # 单批处理条数上界
    max_batches_per_run: 40       # 单次运行批次上界
    older_than_days: 0            # >0 时只扫「这么久没被访问」的

  reflect:                        # 反思与蒸馏（FR-M-06）
    enabled: true
    alias: runtime.default
    max_trajectory_items: 200     # 反思输入的轨迹条数上界
    max_output_items: 5
    min_trajectory_items: 3
    cluster_similarity: 0.6       # 蒸馏找冗余簇的相似度阈值（连通分量）
    min_cluster_size: 3
    max_tokens: 1024

# --------------------------------------------------------------------------- #
# 持久化的通用项（repo / 向量）。
#
# ⚠ `embedding.dim` 必须与该空间实际使用的 embedding 模型维度一致
#   （见 models.emb-dashscope.dimension）。**维度不匹配会硬报错**，不会静默补齐 ——
#   而「改错维度」的症状是「检索结果驴唇不对马嘴」，比启动失败难查。
# --------------------------------------------------------------------------- #
repo:
  embedding:
    space: default              # 向量空间名（src/memory 用它）
    dim: 1024                   # 与 emb-dashscope 的 dimension 一致
    metric: cosine              # cosine | l2 | inner_product
    model_key: emb-dashscope
    # 需要多个空间时改用列表形式（每项 name/dim/metric/model_key）：
    # spaces: [{name: default, dim: 1024, metric: cosine, model_key: emb-dashscope}]

# --------------------------------------------------------------------------- #
# 上下文：这一次给模型看什么。
#
# 两条策略（context.strategy）：
#   linear —— 线性历史 + 多级压缩（越早压得越狠），适合单任务长链路
#   tiered —— 短期窗口 / 会话摘要 / 长期记忆 三层，适合跨天跨会话
# 两者共享 src/context/compact/ 的多级压缩零件。
# --------------------------------------------------------------------------- #
context:
  enabled: true                 # 上下文是必需品，默认开（不像 memory 涉及隐私、bash 涉及安全）
  strategy: linear              # linear | tiered
  alias: runtime.default        # 反查上下文窗口用的逻辑名（窗口来自模型配置）
  dedupe: true                  # 跨段去重（窗口/摘要/长期记忆之间）
  settle_on_close: true         # 会话结束时把对话沉淀进记忆（FR-C-15）

  # 预算（FR-C-12）。窗口大小**不在这里写** —— 它来自 models.<key>.context_window。
  budget:
    reserve_output_tokens: 4096   # 给输出留的；与 models.<key>.max_tokens 对齐
    safety_margin_tokens: 1024    # 估算误差与厂商差异的余量
    # 模型没声明 context_window 时的兜底。**null 表示拒绝兜底**（会报预算不足）
    fallback_model_window: 32768
    # 各段配额（占"可用输入"的比例）。system 与当前输入**不参与分配**（不可动）
    segments:
      window: 0.50
      transition: 0.15
      session_summary: 0.20
      long_term: 0.15
    # 各段下限：低于它**整段不注入**，而不是注入半截（FR-C-13）
    floors:
      window: 256
      transition: 64
      session_summary: 64
      long_term: 64

  # 策略一：线性 + 多级压缩（FR-C-02..06）
  linear:
    compact:
      enabled: true
      max_level: L2             # L1 | L2 | L3。**默认 L2** —— L3 丢时间脉络，应是显式选择
      trigger_ratio: 0.75       # 预算用到多少就升一级
      summary_alias: runtime.default   # 摘要走 gateway 的逻辑名（不写厂商模型）
      max_llm_calls: 2          # 单次请求内最多几次压缩（压缩不能成为第二个成本来源）
      cache: true               # 按内容指纹缓存压缩结果（否则每轮重压）
      l1_max_tool_output_chars: 2000   # L1（零成本那一级）截断工具输出的上限
      keep_recent_turns: 8      # 尾部保护：最近 8 轮原文不参与压缩
      max_summary_tokens: 512
      prompt_version: v1        # 进缓存键：改了提示词不能用旧摘要

  # 策略二：短期 / 会话 / 长期（FR-C-07..11）
  tiered:
    window_size: 10             # N：最近几轮原文（轮，不是 token）
    compress_every: 6           # K：每几轮压缩一次。建议 K ≤ N，否则会产生过渡区
    transition_max_rounds: 20   # 过渡区上限；超过则**强制压缩**（FR-C-09）
    dedupe: true
    long_term:                  # 长期记忆（就是 src/memory；本身开关在 memory.* 段）
      enabled: true
      top_k: 8
      kinds: [fact, preference, task_state, lesson]

  # 摘要回捞原文（FR-C-16）。⚠ 需要 repo.message，目前未实现 ——
  # 没有它会**明确报错**，而不是返回空。
  rehydrate:
    enabled: true

# --------------------------------------------------------------------------- #
# 单 agent 运行时：把「一次任务」跑完 —— 路由、预算、续跑判定、运行内压缩、收尾。
# 循环本身在 src/agent/executor.py；七个阶段的定义在 agent/<stage>/prompt.py。
# --------------------------------------------------------------------------- #
agent:
  enabled: true
  alias: runtime.default          # 对话用的逻辑名；阶段不各配一个

  limits:                         # 三个上界，**没有"不限"这个选项**（C-A-4）
    max_steps: 20                 # 步数
    deadline_s: 600               # **整轮**运行的时间预算（不是单次调用，C-A-3）
    max_cost: null                # 成本上界（null = 不做成本熔断，不是"不限金额"）
    call_timeout_s: 120           # 单次调用的时长上限（与剩余总预算取 min）
    max_tool_calls: 100           # 整轮工具调用次数上界

  # 运行内的上下文（FR-A-08）。一次运行内部的消息**全在同一轮里**，
  # 所以按「步」切而不是按「轮」切 —— 按轮切一步都压不掉。
  context:
    enabled: true
    keep_recent_steps: 4          # 最近几步不压（**必须 ≥1**：当前步要完整可见）
    target_ratio: 0.6             # 每轮压到「模型可用输入」的这个比例以内

  routing:
    # **没有默认值，必须显式配**（C-A-1）：推断不出阶段时是问、兜底、还是拒绝
    on_unknown: ask               # ask | default | reject
    default_stage: requirement    # on_unknown=default 时用哪个
    use_llm: false                # 规则不确定时要不要再用一次 LLM 判断
    llm_alias: runtime.default
    rule_threshold: 0.5           # 规则层的及格线（最高分要 ≥ 它才算判断出来）

  resume:
    # 续跑时发现「工具执行过、结果不明」怎么办（C-A-2）。
    # **默认最保守** —— 宁可停下问一句，不可默默重做。
    on_uncertain: needs_review    # needs_review | abort | retry_uncertain
    lease_s: 120                  # 判「超租约」的阈值（与 idempotency.lease_s 对齐）

  emit_events: true

  # 七个阶段的定义（FR-A-01）。**数据驱动**：新增阶段只加这里 + 一个 prompt 模块。
  # prompt 留空 = 用 agent/<stage>/prompt.py 里的内置提示词。
  stages:
    requirement:  { enabled: true, description: "需求分析" }
    test_design:  { enabled: true, description: "测试设计" }
    test_case:    { enabled: true, description: "用例编写" }
    environment:  { enabled: true, description: "环境准备" }
    execution:    { enabled: true, description: "测试执行" }
    analysis:     { enabled: true, description: "结果分析" }
    defect:       { enabled: true, description: "缺陷管理" }

# --------------------------------------------------------------------------- #
# 组件策略层：把「这次任务该用哪套做法」变成跑之前就能回答、且说得清理由的问题。
#
# ⚠ 这一层**不实现任何策略** —— 它只做登记 / 校验 / 选择 / 装配。
#   策略的实现归各自的家（context / memory / tool / agent），工厂归组合根。
# --------------------------------------------------------------------------- #
strategy:
  enabled: true
  # 降级目标（FR-ST-16）。**必须存在且通过契约校验** —— 配错了启动期硬失败（C-ST-2）
  default_profile: baseline

  selection:
    rules: true                   # 先规则（零成本、可解释）
    evaluated: true               # 再评测数据（需要历史积累）
    weights: { cost: 0.3, latency: 0.2 }   # λc / λt，**只作用于非高风险任务**（C-ST-4）
    min_samples: 20               # 样本少于它就当"没有数据"
    rule_saturation: 2            # 规则层命中几个场景算满分（分母是饱和数，不是关键词总数）

  guard:
    # 高风险只在已验证组合里选（FR-ST-08）。关掉它必须告警（C-ST-3）
    high_risk_requires_validated: true
    risk_source: caller           # caller | template
    sensitive_components: [permission, tool_selection]

  contracts:
    # ⚠ **关掉它等于关掉本模块的理由**（C-ST-1）—— 关掉时启动期会告警
    enabled: true
    extra_rules: []

  # 场景模板（FR-ST-13）。**加模板不改代码**。
  # 只写"这个场景要固定"的那几个组件，其余沿用 baseline。
  # trim：当出现某个输入资产时，把对应组件**回退到 baseline**（FR-ST-14）。
  templates:
    kb_qa:
      risk: low
      description: 知识库问答
      context: tiered
      retrieval: hybrid
      memory: session
      permission: readonly
      tool_selection: fixed
      validation: format
      trim: {}
    case_generation:
      risk: low
      description: 用例生成
      context: tiered
      retrieval: keyword
      memory: session
      permission: restricted
      tool_selection: category
      validation: format
      # 已经有用例时，不需要再去检索协议知识（那个环节是为"从零生成"准备的）
      trim: {has_test_cases: [retrieval]}
    env_operation:
      risk: high
      description: 测试环境操作
      context: tiered
      retrieval: keyword
      memory: stateless
      permission: restricted
      tool_selection: dependency_based
      validation: rules
      execution: retry
      trim: {}
    fault_diagnosis:
      risk: high
      description: 复杂故障诊断
      context: tiered
      retrieval: case_kb
      memory: structured
      permission: readonly
      validation: rules
      execution: retry
      trim: {}
    # 默认配置：**高风险权限一概不含** —— 它是"没人做决定"时的落点（FR-ST-16）
    baseline:
      risk: low
      description: 默认配置（降级目标）
      context: tiered
      retrieval: keyword
      memory: stateless
      permission: readonly
      tool_selection: fixed
      validation: format
      execution: single
      trim: {}

  evaluation:
    enabled: true
    schedule: "23 4 * * *"        # 与 memory 的维护任务错开
    benchmark_set: default
    # **必须有上界**（C-ST-5）：组合是几十到几百个，一次全评能跑到天亮
    max_combos_per_run: 20
